<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a1a">
<title>ZAI Chat — مساعد ذكي</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a1a;--card:#151528;--accent:#6c5ce7;--accent2:#00b894;--text:#e8e8f0;--dim:#8888aa;--err:#e74c3c}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
#header{background:var(--card);padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #22223a}
#header .logo{font-size:24px}
#header h1{font-size:16px;font-weight:700}
#header .sub{font-size:11px;color:var(--dim)}
#status{margin-left:auto;font-size:11px;padding:4px 10px;border-radius:12px;background:#1a1a2e;color:var(--dim)}
#status.on{color:var(--accent2)}
#status.err{color:var(--err)}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid #22223a;border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:transparent;color:var(--dim);font-size:12px;text-align:center}
.msg.error{align-self:center;background:#2a1515;border:1px solid var(--err);color:#ffaaa0;font-size:13px}
.msg pre{background:#0d0d18;padding:8px;border-radius:8px;margin:6px 0;overflow-x:auto;font-size:12px}
.msg code{background:#0d0d18;padding:2px 5px;border-radius:4px;font-size:13px}
.welcome{text-align:center;padding:40px 20px;color:var(--dim)}
.welcome .icon{font-size:48px;margin-bottom:12px}
.welcome h2{font-size:18px;color:var(--text);margin-bottom:6px}
.welcome p{font-size:13px;margin-bottom:20px}
.quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.quick button{background:var(--card);border:1px solid #333355;color:var(--text);padding:8px 14px;border-radius:20px;font-size:12px;cursor:pointer}
.quick button:active{background:var(--accent)}
#inputBar{background:var(--card);padding:10px;border-top:1px solid #22223a;display:flex;gap:8px;align-items:flex-end}
#inputBar textarea{flex:1;background:#0d0d18;border:1px solid #333355;color:var(--text);border-radius:20px;padding:10px 14px;font-size:14px;resize:none;max-height:100px;min-height:42px;line-height:1.4}
#inputBar button{width:42px;height:42px;border:none;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#sendBtn{background:var(--accent);color:#fff}
#camBtn{background:#1a1a2e;color:var(--text)}
#camBtn.active{background:var(--accent2)}
#micBtn{background:#1a1a2e;color:var(--text)}
#micBtn.active{background:#e74c3c;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.typing{display:inline-flex;gap:4px;padding:8px 0}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--dim);animation:bounce 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
#camView{position:fixed;bottom:80px;right:10px;width:120px;height:160px;border-radius:12px;overflow:hidden;border:2px solid var(--accent);z-index:100;display:none}
#camView video{width:100%;height:100%;object-fit:cover}
#camView.show{display:block}
</style>
</head>
<body>

<div id="header">
  <span class="logo">🧠</span>
  <div>
    <h1>ZAI Chat</h1>
    <div class="sub">مساعد ذكي بالعربية</div>
  </div>
  <span id="status">جاهز</span>
</div>

<div id="messages">
  <div class="welcome">
    <div class="icon">🧠</div>
    <h2>ZAI Chat</h2>
    <p>مساعدك الذكي — هضر معاه بأي لغة</p>
    <div class="quick">
      <button onclick="quickSend('مرحبا، كيف حالك؟')">💬 مرحبا</button>
      <button onclick="quickSend('اكتب لي كود HTML بسيط')">💻 كود</button>
      <button onclick="quickSend('اشرح لي الذكاء الاصطناعي ببساطة')">📚 اشرح</button>
      <button onclick="startCam()">📷 بصير</button>
    </div>
  </div>
</div>

<div id="camView"><video id="camVideo" autoplay playsinline muted></video></div>

<div id="inputBar">
  <button id="camBtn" onclick="toggleCam()" title="بصير">📷</button>
  <button id="micBtn" onclick="toggleMic()" title="ميكرو">🎤</button>
  <textarea id="input" rows="1" placeholder="اكتب رسالتك..." oninput="autoGrow(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
  <button id="sendBtn" onclick="send()">➤</button>
</div>

<script>
const API_URL = 'https://base44.app/api/apps/6a1082479423d64dfa027604/functions/zaiVisionChat';
const SYS = 'أنت ZAI — مساعد ذكي مغربي. جاو بالدارجة المغربية المبسطة، كون مختصر ومفيد. تقدر تهضر بالعربية والفرنسية والإنجليزية حسب لغة المستخدم.';

let messages = [];
let camStream = null;
let camActive = false;
let recognizing = false;

const $ = id => document.getElementById(id);
const msgsEl = $('messages');
const inputEl = $('input');
const statusEl = $('status');

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function addMsg(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  // simple formatting
  let html = text
    .replace(/```(\w*)\n?([\s\S]*?)```/g, (m,l,c) => '<pre><code>'+esc(c.trim())+'</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
  el.innerHTML = html;
  msgsEl.appendChild(el);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || '';
}

function showTyping() {
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.id = 'typing';
  el.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  msgsEl.appendChild(el);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function hideTyping() { const t = $('typing'); if (t) t.remove(); }

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  
  inputEl.value = '';
  inputEl.style.height = 'auto';
  addMsg('user', text);
  
  // Build messages array
  const apiMessages = [{ role: 'system', content: SYS }];
  for (const m of messages) {
    apiMessages.push({ role: m.role, content: m.content });
  }
  apiMessages.push({ role: 'user', content: text });
  
  // If camera is active, capture frame and add it
  let vision = false;
  if (camActive && camStream) {
    try {
      const video = $('camVideo');
      const canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, 640, 480);
      const frame = canvas.toDataURL('image/jpeg', 0.6);
      
      apiMessages[apiMessages.length - 1] = {
        role: 'user',
        content: [
          { type: 'text', text: text + '\n\n[البوت كيشوف بالكاميرا - حلل اللي كاين فالصورة]' },
          { type: 'image_url', image_url: { url: frame } }
        ]
      };
      vision = true;
    } catch(e) {
      console.log('frame capture failed:', e);
    }
  }
  
  setStatus('كيفكر...', 'on');
  showTyping();
  
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: apiMessages,
        vision: vision,
        temperature: 0.7
      })
    });
    
    const data = await res.json();
    hideTyping();
    
    if (!res.ok || data.error) {
      addMsg('error', '⚠️ ' + (data.error || 'خطأ فالسيرفر (' + res.status + ')'));
      setStatus('خطأ', 'err');
    } else {
      const reply = data.reply || 'ما قدرتش نجاوب';
      addMsg('bot', reply);
      messages.push({ role: 'user', content: text });
      messages.push({ role: 'assistant', content: reply });
      setStatus('جاهز', 'on');
      speak(reply);
    }
  } catch (e) {
    hideTyping();
    addMsg('error', '⚠️ ما قدرتش نوصل للسيرفر: ' + e.message);
    setStatus('خطأ', 'err');
  }
}

function quickSend(text) {
  inputEl.value = text;
  send();
}

// === CAMERA / VISION ===
async function toggleCam() {
  if (camActive) {
    stopCam();
  } else {
    startCam();
  }
}

async function startCam() {
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    $('camVideo').srcObject = camStream;
    $('camView').classList.add('show');
    $('camBtn').classList.add('active');
    camActive = true;
    addMsg('sys', '📷 البصير تفعّل — كنشوف بالكاميرا. سولني على أي حاجة كنشوفها.');
    setStatus('بصير نشط', 'on');
  } catch (e) {
    addMsg('error', '⚠️ ما قدرتش نشغل الكاميرا: ' + e.message + ' — سمح للتطبيق يستعمل الكاميرا');
    setStatus('خطأ', 'err');
  }
}

function stopCam() {
  if (camStream) {
    camStream.getTracks().forEach(t => t.stop());
    camStream = null;
  }
  $('camView').classList.remove('show');
  $('camBtn').classList.remove('active');
  camActive = false;
  setStatus('جاهز', 'on');
  addMsg('sys', '📷 البصير توقف');
}

// === VOICE ===
function toggleMic() {
  if (recognizing) {
    stopMic();
  } else {
    startMic();
  }
}

function startMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    addMsg('error', '⚠️ المتصفح ديالك ما كيدعمش الإدخال الصوتي. جرّب Chrome.');
    return;
  }
  
  recognition = new SR();
  recognition.lang = 'ar-SA';
  recognition.continuous = false;
  recognition.interimResults = false;
  
  recognition.onstart = () => {
    recognizing = true;
    $('micBtn').classList.add('active');
    setStatus('كنسمع...', 'on');
  };
  
  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript;
    inputEl.value = text;
    inputEl.focus();
  };
  
  recognition.onerror = (e) => {
    addMsg('error', '⚠️ خطأ فالميكرو: ' + e.error);
    stopMic();
  };
  
  recognition.onend = () => { stopMic(); };
  
  recognition.start();
}

function stopMic() {
  if (recognition) { try { recognition.stop(); } catch(e){} }
  recognizing = false;
  $('micBtn').classList.remove('active');
  if (statusEl.textContent === 'كنسمع...') setStatus('جاهز', 'on');
}

function speak(text) {
  if (!window.speechSynthesis) return;
  // Clean text of code blocks for speech
  const clean = text.replace(/```[\s\S]*?```/g, ' كود. ').replace(/[*#`]/g, '');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'ar-SA';
  u.rate = 1;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// Clear chat on long press of header
$('header').addEventListener('long-press', () => {
  messages = [];
  msgsEl.innerHTML = '';
  addMsg('sys', 'تم مسح المحادثة');
});
</script>
</body>
</html>
