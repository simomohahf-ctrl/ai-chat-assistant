<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a1a">
<title>ZAI Vision — مساعد ذكي بصير</title>
<script src="https://js.puter.com/v2/"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a1a;--card:#151528;--accent:#6c5ce7;--accent2:#00b894;--vision:#e94560;--video:#f39c12;--text:#e8e8f0;--dim:#8888aa;--err:#e74c3c}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* Header */
#header{background:var(--card);padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #22223a}
#header .logo{font-size:22px}
#header h1{font-size:15px;font-weight:700}
#header .sub{font-size:10px;color:var(--dim)}
#status{margin-left:auto;font-size:10px;padding:3px 8px;border-radius:10px;background:#1a1a2e;color:var(--dim)}
#status.on{color:var(--accent2)}
#status.err{color:var(--err)}
#status.vision{color:var(--vision);background:#2a1020}
#status.video{color:var(--video);background:#2a2000}

/* Messages */
#messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid #22223a;border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:transparent;color:var(--dim);font-size:12px;text-align:center;padding:6px 16px}
.msg.error{align-self:center;background:#2a1515;border:1px solid var(--err);color:#ffaaa0;font-size:13px}
.msg.video-info{align-self:center;background:#1a1500;border:1px solid var(--video);color:var(--video);font-size:13px;padding:10px 16px;border-radius:12px}
.msg pre{background:#0d0d18;padding:8px;border-radius:8px;margin:6px 0;overflow-x:auto;font-size:12px}
.msg code{background:#0d0d18;padding:2px 5px;border-radius:4px;font-size:13px}
.msg img.thumb{max-width:200px;border-radius:8px;margin:4px 0;border:1px solid #333355}

/* Welcome */
.welcome{text-align:center;padding:30px 20px;color:var(--dim)}
.welcome .icon{font-size:48px;margin-bottom:10px}
.welcome h2{font-size:20px;color:var(--text);margin-bottom:6px}
.welcome p{font-size:13px;margin-bottom:16px}
.welcome .badge{display:inline-block;background:linear-gradient(135deg,#e94560,#ff6b6b);color:#fff;font-size:11px;padding:3px 10px;border-radius:10px;margin-bottom:10px}
.quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.quick button{background:var(--card);border:1px solid #333355;color:var(--text);padding:8px 14px;border-radius:20px;font-size:12px;cursor:pointer}
.quick button:active{background:var(--accent)}

/* Input */
#inputBar{background:var(--card);padding:8px;border-top:1px solid #22223a;display:flex;gap:6px;align-items:flex-end}
#inputBar textarea{flex:1;background:#0d0d18;border:1px solid #333355;color:var(--text);border-radius:20px;padding:10px 14px;font-size:14px;resize:none;max-height:100px;min-height:42px;line-height:1.4}
#inputBar button{width:40px;height:40px;border:none;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#sendBtn{background:var(--accent);color:#fff}
#micBtn{background:#1a1a2e;color:var(--text)}
#micBtn.active{background:#e74c3c;color:#fff;animation:pulse 1s infinite}
#camBtn{background:#1a1a2e;color:var(--text);font-size:16px}
#camBtn.active{background:var(--vision);color:#fff}
#vidBtn{background:#1a1a2e;color:var(--text);font-size:16px}
#vidBtn.active{background:var(--video);color:#fff}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.typing{display:inline-flex;gap:4px;padding:8px 0}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--dim);animation:bounce 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}

/* Camera */
#camView{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:360px;height:auto;aspect-ratio:3/4;border-radius:16px;overflow:hidden;border:3px solid var(--vision);z-index:200;display:none;box-shadow:0 0 30px rgba(233,69,96,.4)}
#camView video{width:100%;height:100%;object-fit:cover}
#camView.show{display:block}
#camOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:150;display:none}
#camOverlay.show{display:block}

/* Video Preview */
#vidPreview{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:92%;max-width:400px;z-index:200;display:none;border-radius:16px;overflow:hidden;border:3px solid var(--video);background:var(--card);box-shadow:0 0 30px rgba(243,156,18,.3)}
#vidPreview.show{display:block}
#vidPreview video{width:100%;max-height:300px;background:#000}
#vidPreview .vid-info{padding:10px 14px;font-size:12px;color:var(--dim)}
#vidPreview .vid-info b{color:var(--video)}
#vidPreview .vid-close{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:28px;height:28px;font-size:14px;cursor:pointer;z-index:201}

/* Progress Bar */
#progressBar{position:fixed;bottom:140px;left:50%;transform:translateX(-50%);width:90%;max-width:400px;z-index:200;display:none;background:var(--card);border:1px solid var(--video);border-radius:12px;padding:12px 16px}
#progressBar.show{display:block}
#progressBar .prog-label{font-size:12px;color:var(--video);margin-bottom:6px;display:flex;justify-content:space-between}
#progressBar .prog-track{width:100%;height:6px;background:#1a1a2e;border-radius:3px;overflow:hidden}
#progressBar .prog-fill{height:100%;background:var(--video);border-radius:3px;transition:width .3s;width:0%}

/* Vision Bar */
#visionBar{background:var(--card);padding:8px;border-top:1px solid #22223a;display:flex;gap:8px}
#visionBtn{flex:1;padding:12px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
#visionBtn.off{background:linear-gradient(135deg,#e94560,#ff6b6b);color:#fff}
#visionBtn.on{background:linear-gradient(135deg,#00b894,#0ed4a0);color:#fff}
#visionBtn:active{transform:scale(.97)}

/* Video Bar */
#videoBar{background:var(--card);padding:6px 8px;border-top:1px solid #22223a;display:flex;gap:6px}
#videoUploadBtn{flex:1;padding:10px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,#f39c12,#f1c40f);color:#1a1a2e;transition:all .2s}
#videoUploadBtn:active{transform:scale(.97)}
#videoUploadBtn.done{background:linear-gradient(135deg,#00b894,#0ed4a0);color:#fff}

/* Badges */
.vision-badge{display:inline-block;background:var(--vision);color:#fff;font-size:10px;padding:2px 8px;border-radius:8px;margin-right:4px}
.video-badge{display:inline-block;background:var(--video);color:#1a1a2e;font-size:10px;padding:2px 8px;border-radius:8px;margin-right:4px}

/* Hidden */
.hidden{display:none !important}
</style>
</head>
<body>

<div id="header">
  <span class="logo">🧠</span>
  <div>
    <h1>ZAI Vision</h1>
    <div class="sub">Meta Llama 4 • Puter.js</div>
  </div>
  <span id="status">جاهز</span>
</div>

<div id="messages">
  <div class="welcome">
    <div class="icon">🧠</div>
    <span class="badge">🚀 Meta Llama 4 — مجاني 100%</span>
    <h2>ZAI Vision</h2>
    <p>مساعدك الذكي — هضر، شوف، وحلل الفيديو</p>
    <div class="quick">
      <button onclick="quickSend('مرحبا، كيف حالك؟')">💬 مرحبا</button>
      <button onclick="quickSend('اكتب لي كود HTML بسيط')">💻 كود</button>
      <button onclick="quickSend('اشرح لي الذكاء الاصطناعي')">📚 اشرح</button>
    </div>
  </div>
</div>

<!-- Camera -->
<div id="camOverlay"></div>
<div id="camView"><video id="camVideo" autoplay playsinline muted></video></div>

<!-- Video Preview -->
<div id="vidPreview">
  <button class="vid-close" onclick="closeVideoPreview()">✕</button>
  <video id="vidPlayer" controls playsinline></video>
  <div class="vid-info" id="vidInfo">جاري التحميل...</div>
</div>

<!-- Progress Bar -->
<div id="progressBar">
  <div class="prog-label">
    <span id="progLabel">معالجة الفيديو...</span>
    <span id="progPercent">0%</span>
  </div>
  <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
</div>

<!-- Hidden file input -->
<input type="file" id="vidFileInput" accept="video/*" style="display:none">

<div id="inputBar">
  <button id="camBtn" onclick="toggleCam()" title="بصير">📷</button>
  <button id="vidBtn" onclick="document.getElementById('vidFileInput').click()" title="رفع فيديو">🎬</button>
  <button id="micBtn" onclick="toggleMic()" title="ميكرو">🎤</button>
  <textarea id="input" rows="1" placeholder="اكتب ولا هضر..." oninput="autoGrow(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
  <button id="sendBtn" onclick="send()">➤</button>
</div>

<!-- Video Upload Bar -->
<div id="videoBar">
  <button id="videoUploadBtn" onclick="document.getElementById('vidFileInput').click()">
    <span>🎬</span>
    <span>رفع فيديو (حتى 200MB)</span>
  </button>
</div>

<!-- Vision Bar -->
<div id="visionBar">
  <button id="visionBtn" class="off" onclick="toggleCam()">
    <span>👁️</span>
    <span id="visionBtnText">تشغيل البصير (كاميرا)</span>
  </button>
</div>

<script>
const SYS = 'أنت ZAI Vision — مساعد ذكي مغربي كيشوف الشاشة والفيديو وكيحللها. جاو بالدارجة المغربية المبسطة، كون مختصر ومفيد. تقدر تهضر بالعربية والفرنسية والإنجليزية.';

let messages = [];
let camStream = null;
let camActive = false;
let recognizing = false;
let recognition = null;

// Video state
let videoFrames = [];        // extracted frames as data URLs
let videoFile = null;
let videoDuration = 0;
let videoReady = false;
const MAX_VIDEO_SIZE = 200 * 1024 * 1024; // 200MB
const MAX_FRAMES = 12;       // max frames to extract
const FRAME_QUALITY = 0.5;   // JPEG quality for frames

const $ = id => document.getElementById(id);
const msgsEl = $('messages');
const inputEl = $('input');
const statusEl = $('status');
const visionBtn = $('visionBtn');
const visionBtnText = $('visionBtnText');

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function addMsg(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  let html = text
    .replace(/```(\w*)\n?([\s\S]*?)```/g, (m,l,c) => '<pre><code>'+esc(c.trim())+'</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
  el.innerHTML = html;
  msgsEl.appendChild(el);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function addMsgWithThumb(role, text, thumbs) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  let html = text
    .replace(/```(\w*)\n?([\s\S]*?)```/g, (m,l,c) => '<pre><code>'+esc(c.trim())+'</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
  if (thumbs && thumbs.length > 0) {
    html += '<br>';
    thumbs.forEach((thumb, i) => {
      html += `<img class="thumb" src="${thumb}" onclick="this.style.maxWidth='90%'" style="margin:4px;cursor:pointer">`;
    });
  }
  el.innerHTML = html;
  msgsEl.appendChild(el);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ''; }

function showTyping() {
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.id = 'typing';
  el.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  msgsEl.appendChild(el);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}
function hideTyping() { const t = $('typing'); if (t) t.remove(); }

function showProgress(label) {
  $('progLabel').textContent = label;
  $('progPercent').textContent = '0%';
  $('progFill').style.width = '0%';
  $('progressBar').classList.add('show');
}
function updateProgress(pct) {
  $('progPercent').textContent = Math.round(pct) + '%';
  $('progFill').style.width = pct + '%';
}
function hideProgress() { $('progressBar').classList.remove('show'); }

// === VIDEO UPLOAD & PROCESSING ===
$('vidFileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  // Check size
  const sizeMB = (file.size / (1024 * 1024)).toFixed(1);
  if (file.size > MAX_VIDEO_SIZE) {
    addMsg('error', `⚠️ حجم الفيديو ${sizeMB}MB — الحد الأقصى هو 200MB`);
    e.target.value = '';
    return;
  }
  
  if (!file.type.startsWith('video/')) {
    addMsg('error', '⚠️ هذا الملف ماشي فيديو. اختر ملف فيديو.');
    e.target.value = '';
    return;
  }
  
  videoFile = file;
  videoFrames = [];
  videoReady = false;
  
  addMsg('video-info', `🎬 تم اختيار: ${file.name} (${sizeMB}MB)`);
  $('vidBtn').classList.add('active');
  $('videoUploadBtn').classList.add('done');
  $('videoUploadBtn').innerHTML = '<span>✅</span><span>فيديو جاهز — اكتب سؤالك</span>';
  
  showProgress('تحميل الفيديو...');
  
  const url = URL.createObjectURL(file);
  const vid = $('vidPlayer');
  vid.src = url;
  
  vid.onloadedmetadata = async () => {
    videoDuration = vid.duration;
    $('vidInfo').innerHTML = `المدة: <b>${formatTime(videoDuration)}</b> | الحجم: <b>${sizeMB}MB</b>`;
    $('vidPreview').classList.add('show');
    
    // Extract frames
    await extractFrames(vid);
  };
  
  vid.onerror = () => {
    hideProgress();
    addMsg('error', '⚠️ ما قدرتش نحمل الفيديو. تاكد من صيغة الملف.');
  };
  
  e.target.value = '';
});

async function extractFrames(vid) {
  showProgress('استخراج الفريمات...');
  videoFrames = [];
  
  const canvas = document.createElement('canvas');
  canvas.width = 640;
  canvas.height = 360;
  const ctx = canvas.getContext('2d');
  
  const numFrames = Math.min(MAX_FRAMES, Math.max(4, Math.floor(videoDuration / 5)));
  const interval = videoDuration / numFrames;
  
  for (let i = 0; i < numFrames; i++) {
    const t = i * interval;
    updateProgress((i / numFrames) * 100);
    
    try {
      await seekTo(vid, t);
      ctx.drawImage(vid, 0, 0, 640, 360);
      const frame = canvas.toDataURL('image/jpeg', FRAME_QUALITY);
      videoFrames.push(frame);
    } catch(e) {
      console.log('Frame error at ' + t + 's:', e);
    }
  }
  
  updateProgress(100);
  videoReady = true;
  hideProgress();
  
  // Auto-analyze
  addMsg('video-info', `✅ تم استخراج ${videoFrames.length} فريم من الفيديو. دابا اكتب سؤالك على الفيديو ولا اضغط "تحليل"`);
  
  // Show thumbnails
  const thumbsEl = document.createElement('div');
  thumbsEl.className = 'msg bot';
  thumbsEl.innerHTML = '<span class="video-badge">🎬 فريمات</span><br>';
  videoFrames.slice(0, 6).forEach(f => {
    thumbsEl.innerHTML += `<img class="thumb" src="${f}" style="margin:4px;cursor:pointer" onclick="this.style.maxWidth='90%'">`;
  });
  if (videoFrames.length > 6) {
    thumbsEl.innerHTML += `<br><small style="color:var(--dim)">+ ${videoFrames.length - 6} فريم أخرى</small>`;
  }
  msgsEl.appendChild(thumbsEl);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  
  // Auto-send analysis
  setStatus('فيديو جاهز', 'video');
}

function seekTo(vid, time) {
  return new Promise((resolve, reject) => {
    vid.currentTime = time;
    const onSeeked = () => {
      vid.removeEventListener('seeked', onSeeked);
      // Small delay to ensure frame is rendered
      setTimeout(resolve, 100);
    };
    vid.addEventListener('seeked', onSeeked);
    setTimeout(() => { vid.removeEventListener('seeked', onSeeked); reject(new Error('seek timeout')); }, 3000);
  });
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}

function closeVideoPreview() {
  $('vidPreview').classList.remove('show');
}

// === SEND MESSAGE ===
async function send() {
  const text = inputEl.value.trim();
  if (!text && !videoReady && !camActive) return;
  if (!text) text = videoReady ? 'حلل هذا الفيديو واشرح اللي كاين فيه' : 'حلل اللي كاين فالشاشة';
  
  inputEl.value = '';
  inputEl.style.height = 'auto';
  addMsg('user', text);
  
  let vision = false;
  let videoMode = false;
  let frameData = null;
  let allFrames = [];
  
  // Collect frames
  if (camActive && camStream) {
    try {
      const video = $('camVideo');
      const canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, 640, 480);
      frameData = canvas.toDataURL('image/jpeg', 0.6);
      vision = true;
    } catch(e) {}
  }
  
  if (videoReady && videoFrames.length > 0) {
    allFrames = videoFrames.slice();
    videoMode = true;
  }
  
  setStatus('كيفكر...', 'on');
  showTyping();
  
  try {
    let reply = '';
    
    if (videoMode) {
      // Video analysis — send multiple frames
      reply = await analyzeVideo(text, allFrames);
    } else if (vision && frameData) {
      // Camera vision — send single frame
      reply = await analyzeImage(text, frameData);
    } else {
      // Text only
      reply = await analyzeText(text);
    }
    
    hideTyping();
    
    let prefix = '';
    if (videoMode) prefix = '<span class="video-badge">🎬 فيديو</span> ';
    else if (vision) prefix = '<span class="vision-badge">👁️ بصير</span> ';
    
    const el = document.createElement('div');
    el.className = 'msg bot';
    let html = prefix + reply
      .replace(/```(\w*)\n?([\s\S]*?)```/g, (m,l,c) => '<pre><code>'+esc(c.trim())+'</code></pre>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
    el.innerHTML = html;
    msgsEl.appendChild(el);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    
    messages.push({ role: 'user', content: text });
    messages.push({ role: 'assistant', content: reply });
    setStatus(videoMode ? 'فيديو جاهز' : (camActive ? 'بصير نشط' : 'جاهز'), videoMode ? 'video' : (camActive ? 'vision' : 'on'));
    speak(reply);
    
  } catch (e) {
    hideTyping();
    addMsg('error', '⚠️ خطأ: ' + e.message);
    setStatus('خطأ', 'err');
  }
}

// === AI ANALYSIS (Puter.js / Meta Llama 4) ===
async function analyzeText(text) {
  const response = await puter.ai.chat(text, { model: 'meta-llama/llama-4-maverick' });
  if (response?.message?.content) return response.message.content;
  if (typeof response === 'string') return response;
  return 'ما قدرتش نجاوب';
}

async function analyzeImage(text, imageData) {
  const prompt = text + '\n\n[البوت كيشوف بالكاميرا - حلل اللي كاين فالصورة]';
  try {
    const response = await puter.ai.chat(prompt, {
      model: 'meta-llama/llama-4-maverick',
      image: imageData
    });
    if (response?.message?.content) return response.message.content;
    if (typeof response === 'string') return response;
    return 'ما قدرتش نحلل الصورة';
  } catch(e) {
    // Fallback: try without image
    const response = await puter.ai.chat(prompt);
    return response?.message?.content || 'ما قدرتش نحلل الصورة: ' + e.message;
  }
}

async function analyzeVideo(text, frames) {
  // Send multiple frames for analysis
  let combinedPrompt = text + '\n\n[تم استخراج ' + frames.length + ' فريم من فيديو مدته ' + formatTime(videoDuration) + '. حلل المحتوى واللي كاين فيه.]';
  
  try {
    // Try with first frame as image
    const response = await puter.ai.chat(combinedPrompt, {
      model: 'meta-llama/llama-4-maverick',
      image: frames[0]
    });
    
    let analysis = '';
    if (response?.message?.content) analysis = response.message.content;
    else if (typeof response === 'string') analysis = response;
    
    if (frames.length > 1) {
      // Send more frames for deeper analysis
      combinedPrompt += '\n\nبناءً على الفريم الأول، إليك فريمات أخرى من الفيديو. أعطني تحليل شامل.';
      try {
        const response2 = await puter.ai.chat(combinedPrompt, {
          model: 'meta-llama/llama-4-maverick',
          image: frames[Math.floor(frames.length / 2)]
        });
        if (response2?.message?.content) {
          analysis += '\n\n--- تحليل إضافي ---\n' + response2.message.content;
        }
      } catch(e) {
        // If multi-frame fails, use single frame analysis
      }
    }
    
    return analysis || 'ما قدرتش نحلل الفيديو';
  } catch(e) {
    // Fallback: text-only description
    const response = await puter.ai.chat('المستخدم رفع فيديو وسأل: ' + text + '. ما قدرتش نشوف الفريمات حيت مشكل تقني، جاو بالمعلومات العامة.');
    return response?.message?.content || 'ما قدرتش نحلل الفيديو: ' + e.message;
  }
}

function quickSend(text) { inputEl.value = text; send(); }

// === CAMERA ===
async function toggleCam() {
  if (camActive) { stopCam(); } else { await startCam(); }
}

async function startCam() {
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    $('camVideo').srcObject = camStream;
    $('camView').classList.add('show');
    $('camOverlay').classList.add('show');
    $('camBtn').classList.add('active');
    visionBtn.classList.remove('off');
    visionBtn.classList.add('on');
    visionBtnText.textContent = '⏹️ البصير نشط — اضغط للإيقاف';
    camActive = true;
    addMsg('sys', '👁️ البصير تفعّل! وجه الكاميرا على أي حاجة وكتب سؤالك.');
    setStatus('بصير نشط', 'vision');
    speak('البصير تفعل. وجه الكاميرا وسولني.');
  } catch (e) {
    addMsg('error', '⚠️ ما قدرتش نشغل الكاميرا: ' + e.message);
    setStatus('خطأ', 'err');
  }
}

function stopCam() {
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  $('camView').classList.remove('show');
  $('camOverlay').classList.remove('show');
  $('camBtn').classList.remove('active');
  visionBtn.classList.remove('on');
  visionBtn.classList.add('off');
  visionBtnText.textContent = 'تشغيل البصير (كاميرا)';
  camActive = false;
  if (!videoReady) setStatus('جاهز', 'on');
  else setStatus('فيديو جاهز', 'video');
  addMsg('sys', '👁️ البصير توقف');
}

$('camOverlay').addEventListener('click', stopCam);

// === VOICE ===
function toggleMic() { if (recognizing) { stopMic(); } else { startMic(); } }

function startMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { addMsg('error', '⚠️ المتصفح ما كيدعمش الميكرو. جرّب Chrome.'); return; }
  recognition = new SR();
  recognition.lang = 'ar-SA';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onstart = () => { recognizing = true; $('micBtn').classList.add('active'); setStatus('كنسمع...', 'on'); };
  recognition.onresult = (e) => { inputEl.value = e.results[0][0].transcript; inputEl.focus(); autoGrow(inputEl); };
  recognition.onerror = (e) => { addMsg('error', '⚠️ خطأ فالميكرو: ' + e.error); stopMic(); };
  recognition.onend = () => { stopMic(); };
  recognition.start();
}

function stopMic() {
  if (recognition) { try { recognition.stop(); } catch(e){} }
  recognizing = false;
  $('micBtn').classList.remove('active');
  if (statusEl.textContent === 'كنسمع...') setStatus(videoReady ? 'فيديو جاهز' : (camActive ? 'بصير نشط' : 'جاهز'), videoReady ? 'video' : (camActive ? 'vision' : 'on'));
}

function speak(text) {
  if (!window.speechSynthesis) return;
  const clean = text.replace(/```[\s\S]*?```/g, ' كود. ').replace(/[*#`]/g, '');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'ar-SA';
  u.rate = 1;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
